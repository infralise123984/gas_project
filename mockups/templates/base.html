<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GasFlow - Mockups{% endblock %}</title>
    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 56px; }
        .footer { padding: 20px 0; }
    </style>
</head>
<body>
    <!-- Navbar simple -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">watonas</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/login/">Login</a>
                <a class="nav-link" href="/mantenedor_clientes/">Clientes</a>
                <a class="nav-link" href="/consultas_pedidos/">Consultas</a>
                <a class="nav-link" href="/transaccional_pedido/">Nuevo Pedido</a>
                <a class="nav-link" href="/reporte_ventas/">Reportes</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="footer bg-light mt-5">
        <div class="container text-center">
            <small class="text-muted">Mockups - GasFlow</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS (opcional, para dropdowns, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
