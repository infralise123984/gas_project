{% extends 'base.html' %}
{% load humanize %}
{% block title %}Mis Entregas - GasFácil{% endblock %}
{% block content %}
<div class="container-fluid px-3 py-4" style="max-width: 540px; margin: 0 auto;">
    <!-- Título centrado y con más aire -->
    <h2 class="text-center fw-bold text-primary mb-4 fs-3">
        <i class="bi bi-truck me-2"></i>Mis Entregas
    </h2>
    
    <!-- Botón de notificaciones push -->
    <div class="text-center mb-4" id="push-notification-container">
        <button type="button" id="push-toggle-btn" class="btn btn-outline-primary btn-lg rounded-pill px-4 py-3 shadow-sm"
                onclick="PushNotifications.handleButtonClick(this)">
            <i class="bi bi-bell me-2"></i>Activar Notificaciones
        </button>
        <p class="text-muted small mt-2 mb-0" id="push-status-text">
            Recibe alertas de nuevos pedidos en tu teléfono
        </p>
    </div>
    
    <!-- Contenedor dinámico de pedidos -->
    <div id="entregas-container">
        {% include 'partials/_entregas_cards.html' %}
    </div>
</div>

<!-- Toast container para mensajes -->
<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;"></div>

<script>
// ═══════════════════════════════════════════════════════════
// Sistema de actualización dinámica de entregas
// ═══════════════════════════════════════════════════════════
(function() {
    'use strict';
    
    const POLL_INTERVAL = 15000; // 15 segundos
    const API_URL = '/entregas/api/';
    
    let lastPendientes = {{ pendientes.count }};
    let lastEnRuta = {{ pedidos_en_ruta.count }};
    let pollTimer = null;
    let isPolling = false;
    
    // Actualizar contenido vía AJAX
    async function actualizarEntregas() {
        if (isPolling) return;
        isPolling = true;
        
        try {
            const response = await fetch(API_URL, {
                credentials: 'same-origin',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            
            if (!response.ok) throw new Error('Error en la respuesta');
            
            const data = await response.json();
            
            // Actualizar el contenedor solo si hay cambios
            if (data.count_pendientes !== lastPendientes || data.count_en_ruta !== lastEnRuta) {
                const container = document.getElementById('entregas-container');
                if (container) {
                    container.innerHTML = data.html;
                    
                    // Si hay nuevos pedidos pendientes, mostrar notificación visual
                    if (data.count_pendientes > lastPendientes) {
                        mostrarToast('Nuevo pedido disponible', 'info');
                    }
                }
                
                lastPendientes = data.count_pendientes;
                lastEnRuta = data.count_en_ruta;
            }
        } catch (error) {
            console.warn('[Entregas] Error actualizando:', error.message);
        } finally {
            isPolling = false;
        }
    }
    
    // Mostrar toast de notificación
    function mostrarToast(mensaje, tipo = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        
        const toastId = 'toast-' + Date.now();
        const bgClass = tipo === 'info' ? 'bg-info' : 'bg-success';
        
        const toastHTML = `
            <div id="${toastId}" class="toast align-items-center text-white ${bgClass} border-0" role="alert">
                <div class="d-flex">
                    <div class="toast-body fw-bold">
                        <i class="bi bi-bell-fill me-2"></i>${mensaje}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        `;
        
        container.insertAdjacentHTML('beforeend', toastHTML);
        
        const toastEl = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
        toast.show();
        
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }
    
    // Iniciar polling
    function iniciarPolling() {
        if (pollTimer) return;
        pollTimer = setInterval(actualizarEntregas, POLL_INTERVAL);
    }
    
    // Detener polling cuando la pestaña no está visible
    function manejarVisibilidad() {
        if (document.hidden) {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        } else {
            actualizarEntregas(); // Actualizar inmediatamente al volver
            iniciarPolling();
        }
    }
    
    // Eventos
    document.addEventListener('DOMContentLoaded', iniciarPolling);
    document.addEventListener('visibilitychange', manejarVisibilidad);
})();

// ═══════════════════════════════════════════════════════════
// Inicializar estado del botón de notificaciones
// ═══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async function() {
    const btn = document.getElementById('push-toggle-btn');
    const statusText = document.getElementById('push-status-text');
    
    if (!btn || !window.PushNotifications) return;
    
    // Verificar si las notificaciones están soportadas
    if (!PushNotifications.isSupported()) {
        btn.classList.add('d-none');
        statusText.textContent = 'Tu navegador no soporta notificaciones push';
        statusText.classList.add('text-warning');
        return;
    }
    
    // Verificar estado actual
    const status = await PushNotifications.checkStatus();
    
    if (status.subscribed) {
        btn.classList.remove('btn-outline-primary');
        btn.classList.add('btn-success');
        btn.innerHTML = '<i class="bi bi-bell-fill me-2"></i>Notificaciones Activas';
        btn.dataset.subscribed = 'true';
        statusText.textContent = 'Recibirás alertas de nuevos pedidos';
        statusText.classList.remove('text-muted');
        statusText.classList.add('text-success');
    } else if (status.permission === 'denied') {
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-bell-slash me-2"></i>Notificaciones Bloqueadas';
        statusText.textContent = 'Debes habilitar las notificaciones en tu navegador';
        statusText.classList.add('text-danger');
    }
});
</script>
{% endblock %}
