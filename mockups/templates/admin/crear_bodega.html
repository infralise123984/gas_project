{% extends "base.html" %}
{% block title %}Crear Bodega - GasFácil{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:600px">
    <h2 class="mb-4">
        <i class="bi bi-shop me-2"></i> Crear Nueva Bodega
    </h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre de la bodega *</label>
                    <input type="text" name="nombre" class="form-control form-control-lg"
                           placeholder="Ej: KIM GAS Rancagua" required maxlength="100" autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Dirección</label>
                    <input type="text" name="direccion" class="form-control form-control-lg"
                           placeholder="Ej: Av. Principal 123" maxlength="250">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">
                        <i class="bi bi-geo-alt me-1"></i> Copiar sectores de otra bodega
                    </label>
                    <select name="copiar_precios_de" class="form-select">
                        <option value="">— No copiar, empezar vacía —</option>
                        {% for b in bodegas_existentes %}
                        <option value="{{ b.id }}">{{ b.nombre }} ({{ b.sectores.count }} sectores)</option>
                        {% endfor %}
                    </select>
                    <div class="form-text">Opcional: hereda los sectores de otra bodega como punto de partida.</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="bi bi-check-lg me-1"></i> Crear Bodega
                    </button>
                    <a href="{% url 'admin_usuarios_bodega' %}" class="btn btn-outline-secondary btn-lg">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
